<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Depth Map Parallax | AI Interactive Mesh</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* UI Overlay */
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px 25px;
            color: white;
            z-index: 10;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-size: 14px;
            transition: 0.2s;
        }
        .controls-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }
        .upload-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .upload-box {
            background: rgba(0,0,0,0.6);
            border-radius: 16px;
            padding: 8px 15px;
            min-width: 160px;
        }
        .upload-box label {
            font-weight: bold;
            display: block;
            font-size: 12px;
            opacity: 0.8;
        }
        .preview-thumb {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 6px;
            border: 1px solid rgba(255,255,255,0.3);
            background: #222;
        }
        .status-badge {
            font-size: 11px;
            margin-top: 4px;
            color: #ccc;
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 140px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 12px;
        }
        input[type="range"] {
            cursor: pointer;
            width: 140px;
        }
        button {
            background: #3a6ea5;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin: 2px;
        }
        button:hover {
            background: #2c5282;
            transform: scale(1.02);
        }
        .gyro-indicator {
            background: #f0ad4e;
            color: #1e2a3a;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .info-text {
            font-size: 11px;
            margin-left: 10px;
            opacity: 0.7;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        @media (max-width: 800px) {
            .controls-group { flex-direction: column; align-items: stretch; }
            .action-buttons { margin-left: 0; justify-content: center; }
            .slider-container { width: auto; }
        }
        .loading-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000000aa;
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 12px;
            color: white;
            z-index: 20;
            font-family: monospace;
            pointer-events: none;
        }
        hr {
            margin: 8px 0;
            border-color: #ffffff33;
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div class="controls-group">
            <div class="upload-group">
                <div class="upload-box">
                    <label>📷 Original Image</label>
                    <input type="file" id="originalInput" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <img id="originalPreview" class="preview-thumb" alt="preview">
                        <span id="originalStatus" class="status-badge">Not loaded</span>
                    </div>
                </div>
                <div class="upload-box">
                    <label>🗺️ Depth Map (B&W: White=Near, Black=Far)</label>
                    <input type="file" id="depthInput" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp">
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <img id="depthPreview" class="preview-thumb" alt="depth preview">
                        <span id="depthStatus" class="status-badge">Not loaded</span>
                    </div>
                </div>
            </div>
            <div class="slider-container">
                <span>📏 Depth Strength: <span id="strengthValue">0.80</span></span>
                <input type="range" id="depthStrength" min="0" max="1.8" step="0.01" value="0.8">
            </div>
            <div class="slider-container">
                <span>🔲 Mesh Resolution: <span id="resValue">80</span> x 80</span>
                <input type="range" id="meshRes" min="24" max="160" step="2" value="80">
            </div>
            <div class="action-buttons">
                <button id="gyroEnableBtn">📱 Enable Gyro</button>
                <button id="gyroDisableBtn">❌ Disable Gyro</button>
                <button id="exportObjBtn">📦 Export OBJ</button>
                <button id="exportScreenshotBtn">📸 Screenshot</button>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap;">
            <div id="gyroStatusBadge" style="display: none;">🧭 Gyro Active: Motion Parallax</div>
            <div class="info-text">💡 Desktop: Drag to rotate | 📱 Mobile: Enable gyro & tilt phone</div>
        </div>
    </div>
    <div id="loadingToast" class="loading-message">⚡ Ready</div>

    <!-- Import Three.js core & add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- DOM Elements ---
        const originalInput = document.getElementById('originalInput');
        const depthInput = document.getElementById('depthInput');
        const originalPreview = document.getElementById('originalPreview');
        const depthPreview = document.getElementById('depthPreview');
        const originalStatusSpan = document.getElementById('originalStatus');
        const depthStatusSpan = document.getElementById('depthStatus');
        const depthStrengthSlider = document.getElementById('depthStrength');
        const strengthVal = document.getElementById('strengthValue');
        const meshResSlider = document.getElementById('meshRes');
        const resValSpan = document.getElementById('resValue');
        const gyroEnableBtn = document.getElementById('gyroEnableBtn');
        const gyroDisableBtn = document.getElementById('gyroDisableBtn');
        const exportObjBtn = document.getElementById('exportObjBtn');
        const exportScreenshotBtn = document.getElementById('exportScreenshotBtn');
        const gyroStatusDiv = document.getElementById('gyroStatusBadge');
        const loadingToast = document.getElementById('loadingToast');

        // --- State ---
        let scene, camera, renderer, controls;
        let currentMesh = null;
        let originalTexture = null;     // Three.js texture
        let depthBrightnessData = null; // { width, height, data: Float32Array 0..1 }
        let originalImageAspect = 1;
        let originalImageLoaded = false;
        let depthMapLoaded = false;
        
        // Gyroscope state
        let gyroActive = false;
        let orientationListener = null;
        let gyroRadius = 3.8;
        let targetCameraPos = { x: 0, y: 0, z: 4 };
        
        // Helper: Show toast
        function showToast(msg, isError = false) {
            loadingToast.textContent = msg;
            loadingToast.style.background = isError ? '#aa3e3edd' : '#000000aa';
            setTimeout(() => {
                if(loadingToast.textContent === msg) loadingToast.textContent = '⚡ Ready';
            }, 2500);
        }

        // --- Setup Three.js Scene ---
        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050b1a);
            scene.fog = new THREE.FogExp2(0x050b1a, 0.008);
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 4.2);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); // preserve for screenshot
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; // subtle shadows
            document.body.appendChild(renderer.domElement);
            
            // Controls (Orbit)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 1.2;
            controls.zoomSpeed = 1.0;
            controls.enableZoom = true;
            controls.target.set(0, 0, 0);
            
            // Lighting: Ambient + directional + fill
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(2, 5, 3);
            mainLight.castShadow = true;
            mainLight.receiveShadow = false;
            scene.add(mainLight);
            const fillLight = new THREE.PointLight(0x5577aa, 0.5);
            fillLight.position.set(-1, 1, 2);
            scene.add(fillLight);
            const backLight = new THREE.PointLight(0xffaa66, 0.3);
            backLight.position.set(0, 0, -2);
            scene.add(backLight);
            
            // Helper grid (optional)
            const gridHelper = new THREE.GridHelper(8, 20, 0x88aaff, 0x335588);
            gridHelper.position.y = -1.2;
            scene.add(gridHelper);
            
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            if (controls && !gyroActive) {
                controls.update(); // only update if gyro inactive
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        // --- Depth Map Pixel Extraction (brightness 0-1) using FileReader ---
        function extractDepthBrightness(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const imgData = ctx.getImageData(0, 0, img.width, img.height);
                        const data = imgData.data;
                        const brightnessArray = new Float32Array(img.width * img.height);
                        for (let i = 0; i < data.length; i += 4) {
                            // Luminance (BT.601) for grayscale / depth map safety
                            const r = data[i];
                            const g = data[i+1];
                            const b = data[i+2];
                            const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255.0;
                            brightnessArray[i/4] = lum; // 0 black -> far, 1 white -> near
                        }
                        resolve({ width: img.width, height: img.height, data: brightnessArray });
                        URL.revokeObjectURL(img.src);
                    };
                    img.onerror = () => reject(new Error("Failed to load depth image"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("FileReader error"));
                reader.readAsDataURL(file);
            });
        }
        
        // --- Load Original Image Texture ---
        function loadOriginalTexture(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const texture = new THREE.Texture(img);
                        texture.needsUpdate = true;
                        texture.wrapS = THREE.RepeatWrapping;
                        texture.wrapT = THREE.RepeatWrapping;
                        originalImageAspect = img.width / img.height;
                        resolve(texture);
                        URL.revokeObjectURL(img.src);
                    };
                    img.onerror = () => reject(new Error("Failed to load original image"));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("FileReader error"));
                reader.readAsDataURL(file);
            });
        }
        
        // --- Generate Displaced Mesh based on current depth data, texture, strength & resolution ---
        async function generateMesh() {
            if (!originalTexture || !depthBrightnessData) {
                showToast("⚠️ Waiting for both Original Image & Depth Map", true);
                return false;
            }
            const strength = parseFloat(depthStrengthSlider.value);
            const segments = parseInt(meshResSlider.value, 10);
            const widthSeg = segments;
            const heightSeg = segments;
            
            // Plane dimensions based on original image aspect ratio
            const planeWidth = originalImageAspect;
            const planeHeight = 1.0;
            
            // Create geometry
            const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight, widthSeg, heightSeg);
            geometry.computeVertexNormals(); // initial normals, will recompute after displacement
            
            const positions = geometry.attributes.position.array;
            const depthW = depthBrightnessData.width;
            const depthH = depthBrightnessData.height;
            const depthArr = depthBrightnessData.data;
            
            // Map vertex UV (we can use built-in uv attribute) but ensure UVs exist
            const uvs = geometry.attributes.uv.array;
            // override / compute displacement for each vertex using uv mapping
            for (let i = 0; i < positions.length / 3; i++) {
                const ix3 = i * 3;
                const u = uvs[i * 2];
                const v = uvs[i * 2 + 1];
                // Sample brightness from depth map (bilinear? nearest for speed & stability)
                const sx = u * (depthW - 1);
                const sy = (1 - v) * (depthH - 1);
                let ix0 = Math.floor(sx);
                let iy0 = Math.floor(sy);
                ix0 = Math.min(Math.max(ix0, 0), depthW - 1);
                iy0 = Math.min(Math.max(iy0, 0), depthH - 1);
                const brightness = depthArr[iy0 * depthW + ix0];
                // brightness 0 => far (negative Z), 1 => near (positive Z)
                // map range: -strength .. +strength
                const zOffset = (brightness - 0.5) * 2 * strength;
                positions[ix3 + 2] = zOffset;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals(); // essential for lighting
            
            const material = new THREE.MeshStandardMaterial({
                map: originalTexture,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide,
                emissive: 0x111111
            });
            
            const newMesh = new THREE.Mesh(geometry, material);
            newMesh.castShadow = true;
            newMesh.receiveShadow = false;
            newMesh.position.y = 0;
            
            // Replace mesh in scene
            if (currentMesh) scene.remove(currentMesh);
            scene.add(newMesh);
            currentMesh = newMesh;
            showToast(`✅ 3D Mesh generated | ${(widthSeg+1)*(heightSeg+1)} vertices`);
            return true;
        }
        
        // --- Rebuild after any relevant change (depth, texture, strength, resolution) ---
        async function refresh3DModel() {
            if (!originalTexture || !depthBrightnessData) return;
            await generateMesh();
        }
        
        // --- Handler for original image upload ---
        async function onOriginalUpload(file) {
            if (!file) return;
            originalStatusSpan.textContent = "Loading...";
            originalPreview.src = "";
            try {
                const texture = await loadOriginalTexture(file);
                if (originalTexture) originalTexture.dispose();
                originalTexture = texture;
                originalImageLoaded = true;
                // show preview
                const readerPreview = new FileReader();
                readerPreview.onload = (e) => { originalPreview.src = e.target.result; };
                readerPreview.readAsDataURL(file);
                originalStatusSpan.textContent = "✅ Texture ready";
                showToast("Original image loaded");
                // if depth ready -> regen
                if (depthBrightnessData) await refresh3DModel();
                else showToast("⬆️ Now upload Depth Map", false);
            } catch (err) {
                console.error(err);
                originalStatusSpan.textContent = "❌ Error";
                showToast("Original image error: " + err.message, true);
            }
        }
        
        // --- Handler for depth map upload ---
        async function onDepthUpload(file) {
            if (!file) return;
            depthStatusSpan.textContent = "Analyzing...";
            depthPreview.src = "";
            try {
                const depthData = await extractDepthBrightness(file);
                depthBrightnessData = depthData;
                depthMapLoaded = true;
                // preview from file
                const readerPrev = new FileReader();
                readerPrev.onload = (e) => { depthPreview.src = e.target.result; };
                readerPrev.readAsDataURL(file);
                depthStatusSpan.textContent = `✅ Depth (${depthData.width}x${depthData.height})`;
                showToast("Depth map ready - generating 3D");
                if (originalTexture) await refresh3DModel();
                else showToast("⬆️ Upload Original Image", false);
            } catch (err) {
                console.error(err);
                depthStatusSpan.textContent = "❌ Parse error";
                showToast("Depth map error: " + err.message, true);
            }
        }
        
        // --- Slider Events ---
        depthStrengthSlider.addEventListener('input', (e) => {
            strengthVal.innerText = parseFloat(e.target.value).toFixed(2);
            if (originalTexture && depthBrightnessData) refresh3DModel();
        });
        meshResSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            resValSpan.innerText = val;
            if (originalTexture && depthBrightnessData) refresh3DModel();
        });
        
        // --- Export OBJ (current mesh vertices and faces) ---
        function exportAsOBJ() {
            if (!currentMesh || !currentMesh.geometry) {
                showToast("No mesh to export", true);
                return;
            }
            const geom = currentMesh.geometry;
            const posAttr = geom.attributes.position;
            const indexAttr = geom.index;
            if (!posAttr) return;
            const vertices = posAttr.array;
            let objContent = "# 3D Depth Map Mesh\n";
            // collect vertices
            for (let i = 0; i < vertices.length / 3; i++) {
                const ix = i*3;
                objContent += `v ${vertices[ix].toFixed(6)} ${vertices[ix+1].toFixed(6)} ${vertices[ix+2].toFixed(6)}\n`;
            }
            // faces (indices)
            if (indexAttr) {
                const indices = indexAttr.array;
                for (let i = 0; i < indices.length; i += 3) {
                    const i1 = indices[i] + 1;
                    const i2 = indices[i+1] + 1;
                    const i3 = indices[i+2] + 1;
                    objContent += `f ${i1} ${i2} ${i3}\n`;
                }
            } else {
                // triangulate assuming quad grid? simpler: for PlaneGeometry with no index, create triangles manually
                const widthSeg = meshResSlider.value;
                const heightSeg = meshResSlider.value;
                const rows = heightSeg + 1;
                const cols = widthSeg + 1;
                for (let row = 0; row < rows-1; row++) {
                    for (let col = 0; col < cols-1; col++) {
                        const i0 = row * cols + col;
                        const i1 = i0 + 1;
                        const i2 = (row+1) * cols + col;
                        const i3 = i2 + 1;
                        objContent += `f ${i0+1} ${i1+1} ${i2+1}\n`;
                        objContent += `f ${i1+1} ${i3+1} ${i2+1}\n`;
                    }
                }
            }
            const blob = new Blob([objContent], {type: "text/plain"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "depth_parallax_mesh.obj";
            link.click();
            URL.revokeObjectURL(link.href);
            showToast("Exported OBJ file");
        }
        
        // --- Screenshot Export (canvas capture)---
        function exportScreenshot() {
            if (!renderer) return;
            // preserveDrawingBuffer true from renderer creation
            const canvas = renderer.domElement;
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = `depth_parallax_${Date.now()}.png`;
            link.click();
            showToast("Screenshot saved");
        }
        
        // ------------------- GYROSCOPE (Mobile Parallax) -------------------
        function handleOrientation(event) {
            if (!gyroActive) return;
            // gamma: left-right (-90 to 90), beta: front-back (-90 to 90)
            let gamma = event.gamma;  // range -90 to 90
            let beta = event.beta;    // range -90 to 90
            if (gamma === null || beta === null) return;
            // Map to spherical angles: azimuth from gamma, elevation from beta
            let azimuth = (gamma / 90) * Math.PI * 0.8;   // max 144 deg rotation
            let elevation = (beta / 90) * Math.PI * 0.6;
            elevation = Math.min(Math.max(elevation, -Math.PI/2.2), Math.PI/2.2);
            const radius = gyroRadius;
            const x = radius * Math.sin(azimuth) * Math.cos(elevation);
            const y = radius * Math.sin(elevation);
            const z = radius * Math.cos(azimuth) * Math.cos(elevation);
            camera.position.set(x, y + 0.2, z);
            controls.target.set(0, 0, 0);
            if (controls) controls.update(); // sync but controls disabled when gyroActive, we just update camera directly
            camera.lookAt(0, 0, 0);
        }
        
        function enableGyro() {
            if (gyroActive) return;
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS specific: request permission via user gesture
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            gyroActive = true;
                            updateGyroUI(true);
                            if (controls) controls.enabled = false;
                            showToast("Gyroscope activated | Tilt phone for 3D effect");
                        } else {
                            showToast("Permission denied for gyro", true);
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        showToast("Gyro permission error", true);
                    });
            } else {
                // Android / non-iOS: directly add listener
                window.addEventListener('deviceorientation', handleOrientation);
                gyroActive = true;
                if (controls) controls.enabled = false;
                updateGyroUI(true);
                showToast("Gyro active - tilt device!");
            }
        }
        
        function disableGyro() {
            if (!gyroActive) return;
            window.removeEventListener('deviceorientation', handleOrientation);
            gyroActive = false;
            if (controls) controls.enabled = true;
            updateGyroUI(false);
            // reset camera slightly to default orbit position
            camera.position.set(0, 0.5, 4.2);
            controls.target.set(0, 0, 0);
            controls.update();
            showToast("Gyro disabled, OrbitControls active");
        }
        
        function updateGyroUI(active) {
            if (active) {
                gyroStatusDiv.style.display = "inline-flex";
                gyroStatusDiv.style.background = "#4caf50";
                gyroStatusDiv.textContent = "🧭 Gyro ACTIVE | Move phone";
            } else {
                gyroStatusDiv.style.display = "none";
            }
        }
        
        // ---- File Input Handlers with reset / loading visuals ----
        originalInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) onOriginalUpload(e.target.files[0]);
        });
        depthInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) onDepthUpload(e.target.files[0]);
        });
        
        // Buttons
        gyroEnableBtn.addEventListener('click', enableGyro);
        gyroDisableBtn.addEventListener('click', disableGyro);
        exportObjBtn.addEventListener('click', exportAsOBJ);
        exportScreenshotBtn.addEventListener('click', exportScreenshot);
        
        // Window resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Startup
        initThree();
        showToast("Ready: Upload Original + Depth Map", false);
        
        // Console logs for debug
        console.log("3D Depth Parallax System Ready | Three.js + Gyro + OBJ export");
    </script>
</body>
</html>
